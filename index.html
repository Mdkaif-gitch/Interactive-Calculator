<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, responsive interactive calculator built with HTML, CSS and JavaScript.">
  <title>Interactive Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div>
          <!-- <p class="eyebrow">JAVASCRIPT PROJECT</p> -->
          <h1>Calculator</h1>
        </div>
        <span class="status-dot" title="Ready"></span>
      </header>

      <div class="display" aria-live="polite">
        <div id="previous-operand" class="previous-operand"></div>
        <div id="current-operand" class="current-operand">0</div>
      </div>

      <div class="keys" id="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete" aria-label="Backspace">⌫</button>
        <button class="key utility" data-action="operator" data-operator="/">÷</button>
        <button class="key operator" data-action="operator" data-operator="*">×</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key operator" data-action="operator" data-operator="-">−</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key operator" data-action="operator" data-operator="+">+</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key zero" data-number="0">0</button>
        <button class="key" data-action="decimal">.</button>
      </div>
      <p class="hint">Keyboard supported · Enter = · Esc = AC · Backspace = delete</p>
    </section>
    <footer>Made with HTML · CSS · JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
